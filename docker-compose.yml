version: "3.9"
services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypass
      POSTGRES_DB: mydb
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://myuser:mypass@db:5432/mydb
      - NODE_ENV=production
    ports:
      - "3000:3000"
    env_file:
      - .env.backend
    depends_on:
      - db

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "80:80"
    env_file:
      - .env.frontend
    depends_on:
      - backend

volumes:
  db-data:
