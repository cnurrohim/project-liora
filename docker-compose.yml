services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypass
      POSTGRES_DB: mydb
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - internal

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"
    networks:
      - internal

  backend:
    image: ghcr.io/cnurrohim/project-root-backend:latest
    restart: always
    env_file:
      - .env.backend
    ports:
      - "3000:3000"
    volumes:
      - ./data/uploads:/app/public/uploads
    depends_on:
      - db
      - redis
    networks:
      - internal

  frontend:
    image: ghcr.io/cnurrohim/project-root-frontend:latest
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - internal

volumes:
  db-data:

networks:
  internal:
    driver: bridge
