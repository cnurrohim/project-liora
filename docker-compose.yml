services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
      - ./data/uploads:/data/uploads
    depends_on:
      - frontend
      - backend
    networks:
      - internal

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypass
      POSTGRES_DB: mydb
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - internal

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"
    networks:
      - internal

  backend:
    image: ghcr.io/cnurrohim/project-root-backend:latest
    restart: always
    env_file:
      - .env.backend
    expose:
      - "3000"
    volumes:
      - ./data/uploads:/app/public/uploads
    depends_on:
      - db
      - redis
    networks:
      - internal

  frontend:
    image: ghcr.io/cnurrohim/project-root-frontend:latest
    restart: always
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - internal

volumes:
  db-data:

networks:
  internal:
    driver: bridge
