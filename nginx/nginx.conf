events {}

http {
  client_max_body_size 10M;

  # ===== HTTP (ACME + REDIRECT) =====
  server {
    listen 80;
    server_name lab.auraria.org api.lab.auraria.org;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ===== FRONTEND HTTPS =====
  server {
    listen 443 ssl;
    server_name lab.auraria.org;

    ssl_certificate /etc/letsencrypt/live/lab.auraria.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lab.auraria.org/privkey.pem;

    location / {
      proxy_pass http://frontend:80;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  # ===== BACKEND HTTPS =====
  server {
    listen 443 ssl;
    server_name api.lab.auraria.org;

    ssl_certificate /etc/letsencrypt/live/lab.auraria.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lab.auraria.org/privkey.pem;

    location / {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /uploads/ {
        alias /data/uploads/;
        expires 30d;
    }
  }



}
