name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 103.127.99.96 >> ~/.ssh/known_hosts

      - name: Deploy to Server
        run: |
          ssh -vvv -i ~/.ssh/deploy_key rokim@103.127.99.96 << 'EOF'
            cd /home/rokim/project-root
            git pull origin main
            docker compose up -d --build
          EOF
